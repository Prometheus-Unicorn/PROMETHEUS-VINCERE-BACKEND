name: Prometheus Cloud Render Pipeline

on:
  workflow_dispatch:
    inputs:
      payload_b64:
        description: "Base64 encoded JSON pipeline payload"
        required: true
        type: string

concurrency:
  group: prometheus-render-${{ github.run_id }}

jobs:
  orchestrate:
    name: "Orchestrate pipeline"
    runs-on: ubuntu-latest
    outputs:
      job_id: ${{ steps.plan.outputs.job_id }}
      slice_matrix: ${{ steps.plan.outputs.slice_matrix }}
      props_r2_key: ${{ steps.plan.outputs.props_r2_key }}
      source_r2_key: ${{ steps.plan.outputs.source_r2_key }}
      matte_r2_key: ${{ steps.plan.outputs.matte_r2_key }}
      song_r2_key: ${{ steps.plan.outputs.song_r2_key }}
      receipt_partial: ${{ steps.plan.outputs.receipt_partial }}
      total_slices: ${{ steps.plan.outputs.total_slices }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Pull target fixture video via Git LFS
        run: |
          git lfs pull --include="remotion-app/public/source/MALE-BLACK-TALKING-HEAD-PODCAST.mp4,remotion-app/public/source/test-video.mp4"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps
        run: pip install --quiet assemblyai boto3 "mediapipe==0.10.21" opencv-python-headless numpy requests

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/*chrome*.list
            sudo apt-get update -o Acquire::Retries=3 -qq || true
            sudo apt-get install -y --no-install-recommends ffmpeg --quiet
          fi
          ffmpeg -version

      - name: Decode payload
        run: |
          echo "${{ inputs.payload_b64 }}" | base64 -d > /tmp/pipeline_payload.json
          echo "Payload decoded:"
          cat /tmp/pipeline_payload.json

      - name: Validate V2 typography catalog presence
        env:
          PYTHONPATH: "."
        run: |
          python -c "import mini_run_pipeline.typography as t; n=len(t.load_typography_profiles_v2_catalog()['profiles']); print(f'V2 CATALOG PROFILES: {n}'); assert n > 0, 'V2 catalog missing from checkout — deploy is incomplete'"

      - name: Run orchestration plan
        id: plan
        env:
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_UPLOAD_BUCKET: ${{ secrets.R2_UPLOAD_BUCKET }}
          R2_PROCESSED_BUCKET: ${{ secrets.R2_PROCESSED_BUCKET }}
          PARALLEL_SLICES: "10"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PYTHONUTF8: "1"
          PYTHONPATH: "."
        run: python .github/scripts/gha_orchestrate.py

  render_slice:
    name: "Slice ${{ matrix.slice_index }}"
    needs: orchestrate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.orchestrate.outputs.slice_matrix) }}
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps
        run: pip install --quiet boto3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Cache node modules and Chromium
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            node_modules
            remotion-app/node_modules
            ~/.cache/remotion
          key: ${{ runner.os }}-remotion-cache-${{ hashFiles('package-lock.json', 'remotion-app/package.json') }}
          restore-keys: |
            ${{ runner.os }}-remotion-cache-

      - name: Install dependencies & setup environment
        run: |
          if [ "${{ steps.cache-deps.outputs.cache-hit }}" != "true" ]; then
            npm install --legacy-peer-deps --prefer-offline --no-audit --no-fund
            cd remotion-app && npm install --legacy-peer-deps --prefer-offline --no-audit --no-fund && cd ..
          fi
          npm --workspace @prometheus/shared-types run build || true
          mkdir -p node_modules/@prometheus
          rm -rf node_modules/@prometheus/shared-types
          ln -sf "$(pwd)/packages/shared-types" node_modules/@prometheus/shared-types || \
          cp -a packages/shared-types node_modules/@prometheus/shared-types
          mkdir -p remotion-app/node_modules/@prometheus
          rm -rf remotion-app/node_modules/@prometheus/shared-types
          ln -sf "$(pwd)/packages/shared-types" remotion-app/node_modules/@prometheus/shared-types || \
          cp -a packages/shared-types remotion-app/node_modules/@prometheus/shared-types
          mkdir -p remotion-app/public/textures
          cp -rn mini_run_pipeline/textures/* remotion-app/public/textures/ 2>/dev/null || true

      - name: Download source video + props from R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_UPLOAD_BUCKET: ${{ secrets.R2_UPLOAD_BUCKET }}
          R2_PROCESSED_BUCKET: ${{ secrets.R2_PROCESSED_BUCKET }}
          PROPS_R2_KEY: ${{ needs.orchestrate.outputs.props_r2_key }}
          SOURCE_R2_KEY: ${{ needs.orchestrate.outputs.source_r2_key }}
          MATTE_R2_KEY: ${{ needs.orchestrate.outputs.matte_r2_key }}
          JOB_ID: ${{ needs.orchestrate.outputs.job_id }}
        run: python .github/scripts/gha_download_inputs.py

      - name: Render slice
        env:
          SLICE_INDEX: ${{ matrix.slice_index }}
          START_FRAME: ${{ matrix.start_frame }}
          END_FRAME: ${{ matrix.end_frame }}
          SCALE: ${{ matrix.scale }}
          JOB_ID: ${{ needs.orchestrate.outputs.job_id }}
        run: |
          mkdir -p /tmp/slices
          SCALE_ARG=""
          if [ -n "$SCALE" ] && [ "$SCALE" != "1.0" ] && [ "$SCALE" != "1" ]; then
            SCALE_ARG="--scale=$SCALE"
          fi
          npx remotion render \
            src/index.ts PrometheusMinRun \
            /tmp/slices/slice_${SLICE_INDEX}.mp4 \
            --props /tmp/props_${JOB_ID}.json \
            --frames=${START_FRAME}-${END_FRAME} \
            --concurrency=1 \
            --gl=swangle \
            --disable-web-security \
            --pixel-format=yuv420p \
            --jpeg-quality=90 \
            --muted \
            --timeout=600000 \
            $SCALE_ARG
        working-directory: remotion-app

      - name: Upload slice to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_PROCESSED_BUCKET: ${{ secrets.R2_PROCESSED_BUCKET }}
          SLICE_INDEX: ${{ matrix.slice_index }}
          JOB_ID: ${{ needs.orchestrate.outputs.job_id }}
        run: python .github/scripts/gha_upload_slice.py

  stitch:
    name: "Stitch & finalise"
    needs: [orchestrate, render_slice]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps
        run: pip install --quiet boto3 requests pillow numpy opencv-python-headless

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/*chrome*.list
            sudo apt-get update -o Acquire::Retries=3 -qq || true
            sudo apt-get install -y --no-install-recommends ffmpeg --quiet
          fi
          ffmpeg -version

      - name: Download all slices + stitch
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_PROCESSED_BUCKET: ${{ secrets.R2_PROCESSED_BUCKET }}
          R2_PUBLIC_PROCESSED_BASE: ${{ secrets.R2_PUBLIC_PROCESSED_BASE }}
          JOB_ID: ${{ needs.orchestrate.outputs.job_id }}
          PROPS_R2_KEY: ${{ needs.orchestrate.outputs.props_r2_key }}
          SONG_R2_KEY: ${{ needs.orchestrate.outputs.song_r2_key }}
          RECEIPT_PARTIAL: ${{ needs.orchestrate.outputs.receipt_partial }}
          TOTAL_SLICES: ${{ needs.orchestrate.outputs.total_slices }}
          PYTHONPATH: "."
        run: python .github/scripts/gha_stitch.py

      - name: Upload receipt artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-receipt-${{ needs.orchestrate.outputs.job_id }}
          path: /tmp/receipt_${{ needs.orchestrate.outputs.job_id }}.json
          retention-days: 7

      - name: Upload master MP4 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-master-${{ needs.orchestrate.outputs.job_id }}
          path: /tmp/master_${{ needs.orchestrate.outputs.job_id }}.mp4
          retention-days: 7
