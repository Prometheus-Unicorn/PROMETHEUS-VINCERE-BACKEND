name: Headless Google Flow Video Generation

on:
  workflow_dispatch:
    inputs:
      transcript_json:
        description: "Optional raw transcript JSON string"
        required: false
        default: ""

jobs:
  generate-flow-video:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
        continue-on-error: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pywin32 cryptography playwright boto3 opencv-python-headless numpy requests google-genai
          python -m playwright install chromium

      - name: Run Headless Google Flow Generation & Hostile Critique
        env:
          FLOW_AUTH_KEY: ${{ secrets.FLOW_AUTH_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FLOW_PROXY_URL: ${{ secrets.FLOW_PROXY_URL }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_UPLOAD_BUCKET: ${{ secrets.R2_UPLOAD_BUCKET }}
        run: |
          python -m mini_run_pipeline.flow_gha_runner

      - name: Upload Video Artifacts and Receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-generation-artifacts
          path: |
            docs/mini_run_studio/flow_clips/gha_flow_output.mp4
            docs/mini_run_studio/flow_clips/gha_flow_output.receipt.json
            scratch/*.png
